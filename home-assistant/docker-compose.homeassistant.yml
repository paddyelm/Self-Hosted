version: '3.8'
services:
  homeassistant:
    image: homeassistant/home-assistant:latest
    container_name: homeassistant
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    ports:
      - "8123:8123"
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"
    networks:
      - main_network
